name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client & Validate Schema
        env:
          DATABASE_URL: 'postgresql://postgres:mock@localhost:5432/mock'
          DIRECT_URL: 'postgresql://postgres:mock@localhost:5432/mock'
        run: |
          npx prisma validate
          npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Vitest unit tests
        run: npm run test

      - name: Run Next.js production build
        run: npm run build
